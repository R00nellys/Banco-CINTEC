<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Projeto CINTEC</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <header>
    <!-- Logo Esquerda -->
    <img src="Captura de tela 2025-09-08 132254.png" alt="Logo Cintec Esquerda" class="logo-esquerda">
    <!-- Logo Central -->
    <img src="Captura de tela 2025-09-08 132328.png" alt="Logo Cintec Central" class="logo-central">
  </header>

  <main>
    <div class="container">
      <div class="card">
        <h1>Login</h1>
        <p>Entre com seu e-mail e senha:</p>

        <form id="loginForm" autocomplete="off" onsubmit="login(event)">
          <div class="input-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="Seu e-mail" required />
          </div>

          <div class="input-group">
            <label for="password">Senha</label>
            <input type="password" id="password" placeholder="Sua senha" required />
          </div>

          <div class="links">
            <a href="esqueceu.html">Esqueceu a senha?</a>
          </div>

          <button type="submit" class="btn">Entrar</button>

          <p class="cadastro-link">
            Ainda não tem conta?
            <a href="cadastro.html">Cadastre-se aqui</a>
          </p>
        </form>
      </div>
    </div>
  </main>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <!-- Configuração do Firebase (igual ao cadastro.js usa) -->
  <script src="js.js"></script>

  <!-- Script de login -->
  <script src="login.js"></script>
</body>
</html>
